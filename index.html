<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBOS Home+</title>
<style>
:root {
  /* OBOS brand palette */
  --obos-blue: #1B3F8B;
  --obos-blue-deep: #122B61;
  --obos-blue-light: #E8EEFB;
  --obos-mint: #bedfec;
  --obos-mint-deep: #5b9eb5;
  --obos-mint-text: #1f4a5c;
  --obos-mint-light: #eaf4fa;

  /* Working palette (driven from brand) */
  --bg: #ffffff;
  --bg-soft: #f6f7fa;
  --bg-card: #ffffff;
  --ink: #1f2433;
  --ink-soft: #4d5468;
  --ink-faint: #8089a0;
  --line: #d8dce8;
  --line-soft: #ebeef5;

  /* Default accent (greeting/threshold/global pages: mint) */
  --accent: var(--obos-mint);
  --accent-deep: var(--obos-mint-deep);
  --accent-light: var(--obos-mint-light);
  --accent-text: var(--obos-mint-text);

  --alert: #b04545;
  --alert-bg: #fbeae8;
  --safeguard: #8b6332;
  --safeguard-bg: #f5ecd8;
}

/* When in the Home arc, accents flip to blue */
body.home-arc {
  --accent: var(--obos-blue);
  --accent-deep: var(--obos-blue-deep);
  --accent-light: var(--obos-blue-light);
  --accent-text: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg-soft);
  color: var(--ink);
  font-family: 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
  font-size: 17px;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 925px;
  margin: 0 auto;
  padding: 32px 28px 80px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header (single centred title) */
.brand {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.brand-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.01em;
  text-align: center;
}

/* Cards */
.card {
  background: var(--bg-card);
  padding: 44px 42px;
  border-radius: 16px;
  box-shadow: 0 1px 2px rgba(31, 36, 51, 0.04), 0 4px 16px rgba(31, 36, 51, 0.06);
  border: 1px solid var(--line);
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Section-aware top stripe on the card (subtle visual signal of where you are) */
.card.wellness-arc { border-top: 3px solid var(--obos-mint-deep); }
.card.home-arc-card { border-top: 3px solid var(--obos-blue); }

h1 {
  font-size: 30px;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 22px;
  color: var(--ink);
}
h2 {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.35;
  margin-bottom: 18px;
  color: var(--ink);
}
h3 {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin-bottom: 10px;
}
p { margin-bottom: 14px; }
p.soft { color: var(--ink-soft); }
p.lead { font-size: 19px; line-height: 1.6; margin-bottom: 24px; }

.question-text {
  font-size: 24px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 24px;
}
.question-note {
  color: var(--ink-soft);
  font-size: 15px;
  margin-bottom: 20px;
  padding: 12px 16px;
  background: var(--bg-soft);
  border-left: 3px solid var(--accent);
  border-radius: 0 2px 2px 0;
}

.reflection {
  font-size: 18px;
  line-height: 1.6;
  padding: 22px 26px;
  background: var(--accent-light);
  border-left: 4px solid var(--accent);
  border-radius: 0 4px 4px 0;
  margin: 20px 0;
  color: var(--ink);
}

textarea, input[type="text"] {
  width: 100%;
  font-family: inherit;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 4px;
  padding: 14px 16px;
  resize: vertical;
  min-height: 110px;
  margin-bottom: 14px;
  transition: border-color 0.18s ease;
}
input[type="text"] { min-height: auto; }
textarea:focus, input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
}

select {
  font-family: inherit;
  font-size: 16px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 4px;
  width: 100%;
  color: var(--ink);
  margin-bottom: 12px;
}

.button-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.button-row.stack { flex-direction: column; }

button {
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  padding: 13px 22px;
  border: 1.5px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.18s ease;
  line-height: 1.3;
}
button:hover {
  border-color: var(--accent);
  background: var(--bg-soft);
}
button.primary {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
}
button.primary:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
  color: #ffffff;
}
button.ghost {
  background: transparent;
  border-color: transparent;
  color: var(--ink-soft);
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: var(--line);
  padding: 13px 8px;
  font-weight: 500;
}
button.ghost:hover {
  color: var(--accent);
  background: transparent;
  text-decoration-color: var(--accent);
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.scale-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.scale-row button { flex: 1; min-width: 180px; text-align: left; padding: 16px 20px; font-weight: 500; }
.scale-row button.selected { background: var(--accent); color: var(--accent-text); border-color: var(--accent-deep); }

.voice-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--ink-soft);
}
.voice-button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 13px;
  font-size: 13px;
  font-weight: 600;
  border: 1.5px solid var(--line);
  background: var(--bg);
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 4px;
}
.voice-button.recording { background: var(--accent); color: var(--accent-text); border-color: var(--accent-deep); }
.voice-button:hover { border-color: var(--accent); }
.voice-status { font-style: italic; color: var(--ink-faint); }

.progress {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.progress-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}

.quote {
  padding: 18px 22px;
  background: var(--bg-soft);
  border-left: 3px solid var(--accent);
  margin: 20px 0;
  font-size: 16px;
  color: var(--ink-soft);
  border-radius: 0 4px 4px 0;
}

/* Alert / safety cards */
.alert-card {
  background: var(--alert-bg);
  border: 1.5px solid var(--alert);
  padding: 32px 32px;
  border-radius: 6px;
}
.alert-card h2 { color: var(--alert); }
.alert-card.safeguard { background: var(--safeguard-bg); border-color: var(--safeguard); }
.alert-card.safeguard h2 { color: var(--safeguard); }
.resource-list { list-style: none; padding: 0; margin: 20px 0; }
.resource-list li { padding: 11px 0; border-bottom: 1px solid var(--line); }
.resource-list li:last-child { border-bottom: none; }
.resource-list strong { display: block; margin-bottom: 3px; font-weight: 700; }
.resource-list span { color: var(--ink-soft); font-size: 14px; }

/* Reports: ARIAL throughout, clean clinical styling */
.report {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink);
  padding: 24px 28px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  margin: 16px 0;
}
.report h1, .report h2, .report h3 {
  font-family: Arial, Helvetica, sans-serif;
}
.report h2 {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-deep);
  margin: 22px 0 10px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line-soft);
}
.report h2:first-child { margin-top: 0; }
.report p { margin-bottom: 12px; font-size: 15px; }
.report strong { font-weight: 700; }
.report-list { list-style: none; padding: 0; margin: 8px 0 14px; }
.report-list li { padding: 6px 0 6px 16px; position: relative; }
.report-list li:before {
  content: '';
  position: absolute;
  left: 0;
  top: 14px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.loading {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--ink-faint);
  font-size: 16px;
}
.loading-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.4s ease-in-out infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1); }
}

.footer-info {
  margin-top: 36px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
  font-weight: 500;
}

.linkage-statement {
  background: var(--bg);
  border: 2px solid var(--accent);
  padding: 24px 28px;
  margin: 20px 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  border-radius: 4px;
}
.linkage-rule {
  background: var(--accent-light);
  padding: 18px 22px;
  border-left: 3px solid var(--accent);
  font-size: 14px;
  margin: 18px 0;
  color: var(--ink);
  border-radius: 0 4px 4px 0;
}

.dev-toggle {
  margin-top: 20px;
  padding: 14px;
  background: var(--bg-soft);
  border: 1px dashed var(--line);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-soft);
}
.dev-toggle strong { color: var(--ink); }
.dev-toggle label { display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 6px 0; }

/* Share confirmation modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31, 36, 51, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal {
  background: white;
  border-radius: 8px;
  padding: 36px 36px;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  border-top: 4px solid var(--accent);
}
.modal h2 { color: var(--accent-deep); margin-bottom: 14px; }
.modal-check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 26px;
  margin-bottom: 14px;
}

@media print {
  body { background: white; }
  .app { padding: 0; max-width: 100%; }
  .brand, .footer-info, .button-row, .voice-controls, .skip-link, .dev-toggle, .modal-backdrop { display: none !important; }
  .card { box-shadow: none; border: none; padding: 0; }
  .report { font-family: Arial, Helvetica, sans-serif; border: none; padding: 0; }
}

@media (max-width: 640px) {
  .app { padding: 24px 18px 60px; }
  .card { padding: 28px 22px; }
  h1 { font-size: 24px; }
  .question-text { font-size: 20px; }
  .scale-row button { min-width: 100%; }
  .button-row { flex-direction: column; }
  .button-row button { width: 100%; }
}

.fade-in { animation: gentle-rise 0.45s ease-out; }
@keyframes gentle-rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Three-panel final summary layout */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin: 20px 0 24px;
}
.summary-panel {
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 24px 22px;
  display: flex;
  flex-direction: column;
  min-height: 280px;
}
.summary-panel.wellness {
  border-top: 5px solid var(--obos-mint-deep);
  background: linear-gradient(to bottom, var(--obos-mint-light) 0%, var(--bg) 50%);
}
.summary-panel.community {
  border-top: 5px solid #b0b6c7;
  background: linear-gradient(to bottom, #f3f4f8 0%, var(--bg) 50%);
}
.summary-panel.obos {
  border-top: 5px solid var(--obos-blue);
  background: linear-gradient(to bottom, var(--obos-blue-light) 0%, var(--bg) 50%);
}
.summary-panel h3 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.summary-panel.wellness h3 { color: var(--obos-mint-text); }
.summary-panel.community h3 { color: #5a6378; }
.summary-panel.obos h3 { color: var(--obos-blue); }
.summary-panel h4 {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 12px;
  line-height: 1.3;
}
.summary-panel-desc {
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-soft);
  margin-bottom: 16px;
  flex: 1;
}
.summary-panel-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.summary-panel-actions button {
  font-size: 14px;
  padding: 10px 14px;
  width: 100%;
  text-align: center;
}
.summary-panel.unavailable {
  opacity: 0.6;
  background: var(--bg-soft);
}
.summary-panel.unavailable h4 { color: var(--ink-faint); }
.summary-grid-footer {
  display: flex;
  justify-content: center;
  margin-top: 8px;
}

@media (max-width: 880px) {
  .summary-grid { grid-template-columns: 1fr; }
  .summary-panel { min-height: auto; }
}
</style>
</head>
<body>
<div class="app">
  <header class="brand">
    <div class="brand-title">Built for OBOS, Person First</div>
  </header>
  <main id="screen" class="card fade-in"></main>
  <footer class="footer-info">
    <span>Created by Assistiv Systems Ltd</span>
    <span id="ironCurtainStatus">Etterlever Personopplysningsloven</span>
  </footer>
</div>
<div id="modalHost"></div>

<script>
/* OBOS Home+ V1 (revised), faithful to V16.2.
   Iron Curtain enforced at data-model and API-call layers.
   Revisions in this build:
   - OBOS logo on every screen.
   - OBOS blue and green palette: green for Wellness arc (Sections 1-3), blue for Home arc (Section 4).
   - Safety interrupts (crisis, safeguarding, hostility) advance to next question on resume, not re-ask.
   - Em dashes removed from all interface copy, system prompts, and report templates.
   - Reports rendered in Arial.
   - Routed artifacts include both Print and Share buttons; share is spoof-confirmed via modal.
   - Final goodbye screen wipes session and instructs resident to close the tab. */

const QUESTIONS = {
  s1: { title: "About You", questions: [
    { key: "s1q1", text: "What is most important to you in your day-to-day life right now?", type: "open" },
    { key: "s1q2", text: "What does a good day look like for you?", type: "open" },
    { key: "s1q3", text: "What are you most proud of in how you manage your life?", type: "open" },
    { key: "s1q4", text: "Who matters most to you? Who do you like to stay connected with?", type: "open" },
    { key: "s1q5", text: "Is there something you have always done, or always been, that feels very much like you?", type: "open" }
  ]},
  s2: { title: "How Things Are Going", questions: [
    { key: "s2q1", text: "What are you enjoying most at the moment?", type: "open" },
    { key: "s2q2", text: "Is there anything that feels harder than it used to?", type: "open", optional: true },
    { key: "s2q3", text: "How do you feel about getting around and doing physical things day to day?",
      type: "scale", options: ["It's going well", "It varies", "It feels harder than it was"] },
    { key: "s2q4", text: "How do you feel about your memory and concentration?",
      type: "scale", options: ["It's going well", "It varies", "It feels harder than it was"],
      note: "This is not a memory test. If memory support would be useful to you, there are gentle ways to help with that." },
    { key: "s2q5", text: "Do you ever feel lonely or less connected to people than you would like?", type: "open", optional: true },
    { key: "s2q6", text: "How confident do you feel about managing things at home independently?",
      type: "scale", options: ["Very confident", "It varies", "Less confident than I was"] }
  ]},
  s3: { title: "What Matters About the Future", questions: [
    { key: "s3q1", text: "If things stay broadly as they are, what would you most want to make sure stays the same?", type: "open" },
    { key: "s3q2", text: "Is there anything you would love to do more of, or get back to?", type: "open", optional: true },
    { key: "s3q3", text: "When you think about the future, is there anything you hope for?", type: "open", optional: true },
    { key: "s3q4", text: "Is there anything about the future that you find yourself worrying about?", type: "open", optional: true }
  ]},
  s4: { title: "About Your Home", questions: [
    { key: "s4q1", text: "How are things with your home, your apartment, the building, the way you get in and out?", type: "open" },
    { key: "s4q2", text: "Is there anything in or around your home that feels harder, or more frustrating, than it should?", type: "open", optional: true },
    { key: "s4q3", text: "How are things with your neighbours and the wider building community?", type: "open", optional: true },
    { key: "s4q4", text: "Is there anything else about your home or surroundings you would like OBOS to know?", type: "open", optional: true }
  ]}
};

let session = {
  anthropicApiKey: null,
  name: null,
  honorific: null,
  vinterTryggActive: false,
  wellnessArc: { answers: {}, skipCount: 0, assetCaptured: false, assetTalent: null, assetConsent: null },
  homeArc: { answers: {}, skipCount: 0 },
  linkage: { candidateDetected: false, paraphrasedFragment: null, homeIssueQuoted: null, residentConfirmed: false, fixedStatement: null },
  safetyFlags: { crisis: false, safeguarding: false, hostility: false, anyFiredThisSession: false },
  callCount: 0,
  estCost: 0,
  wellnessReport: null,
  homeReport: null,
  engagementLevel: 0,
  _linkageApproved: false,
  _suppressHomeReport: false,
  // Tracks routing actions for the final summary
  sharedReports: []
};

const MODEL = 'claude-opus-4-7';
const COST_PER_CALL_EST = 0.04;
const VOICE_SILENCE_MS = 5000;
const STILL_LISTENING_MS = 2000;
const SKIP_NOTE_THRESHOLD = 3;
const SKIP_OFFRAMP_THRESHOLD = 6;

const SCREEN = document.getElementById('screen');
const MODAL_HOST = document.getElementById('modalHost');

let currentSection = null;
let currentQIndex = 0;
let _selectedScaleIdx = null;

function setScreen(html, extraCardClass) {
  // Card class set per arc for the subtle stripe
  SCREEN.className = 'card fade-in';
  if (extraCardClass) SCREEN.classList.add(extraCardClass);
  void SCREEN.offsetWidth;
  SCREEN.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function updateMeter() { /* meter removed from UI; calls tracked internally for cost transparency */ }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function addressForm() {
  if (session.name && session.honorific) return `${session.honorific} ${session.name}`;
  if (session.name) return session.name;
  return null;
}

function setArc(arc) {
  if (arc === 'home') document.body.classList.add('home-arc');
  else document.body.classList.remove('home-arc');
}

/* API LAYER */
async function callClaude(systemPrompt, userMessage, maxTokens = 600) {
  if (!session.anthropicApiKey) throw new Error('No API key configured.');
  session.callCount++;
  session.estCost += COST_PER_CALL_EST;
  updateMeter();
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': session.anthropicApiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: MODEL, max_tokens: maxTokens, system: systemPrompt,
      messages: [{ role: 'user', content: userMessage }]
    })
  });
  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API error ${response.status}: ${err}`);
  }
  const data = await response.json();
  return data.content[0].text.trim();
}

/* CLASSIFIERS */
const NO_EM_DASH_RULE = "Do not use em dashes or en dashes in any output. Use commas, semicolons, or full stops instead.";

const CRISIS_PROMPT = `You are a safety classifier for a welfare conversation tool used by older residents in Norway. Evaluate ONE answer to ONE question and return a binary verdict.

Return EXACTLY one word, either FIRE or PASS.

Return FIRE only on EXPLICIT, PRESENT-TENSE, SELF-DIRECTED statements of:
- Suicidal ideation or planning
- Active self-harm
- Acute hopelessness framed as "nothing to live for" or "no point continuing"
- Imminent danger to self

Do NOT fire on general sadness, grief, loneliness, past-tense difficulty, metaphorical language, fictional or historical references, worry about the future, frustration, fatigue, or expressions of low mood without active risk.

When in doubt, return PASS.`;

const SAFEGUARDING_PROMPT = `You are a safeguarding classifier for a welfare conversation tool used by older residents in Norway. Evaluate ONE answer to ONE question and return a binary verdict.

Return EXACTLY one word, either FIRE or PASS.

Return FIRE only on EXPLICIT, PRESENT-TENSE disclosures of:
- Physical, psychological, financial, or sexual abuse
- Coercive control by a family member, carer, or other person
- Enforced isolation by another person
- Neglect by a carer
- Fear of a specific named person in the context of harm

Do NOT fire on general loneliness, grief, conflict without fear, neighbour disputes, frustration, ordinary family disagreement, or references to past events without ongoing risk.

When in doubt, return PASS.`;

const HOSTILITY_PROMPT = `You are a consent-withdrawal classifier for a welfare conversation tool. Evaluate ONE answer and return a binary verdict.

Return EXACTLY one word, either FIRE or PASS.

Return FIRE if the resident is expressing:
- Withdrawal of consent ("I don't want to do this", "stop", "leave me alone")
- Refusal of the conversation itself
- Active hostility toward the tool or process

Do NOT fire on a resident saying they don't know how to answer, expressing uncertainty, declining one specific question (that is what skip is for), being terse, or being matter-of-fact.

When in doubt, return PASS.`;

async function runClassifier(systemPrompt, answer) {
  try {
    const verdict = await callClaude(systemPrompt, `Answer: "${answer}"\n\nVerdict:`, 10);
    return verdict.trim().toUpperCase().startsWith('FIRE');
  } catch (e) {
    console.warn('Classifier error:', e);
    return false;
  }
}
async function runAllClassifiers(answer) {
  const [crisis, safeguarding, hostility] = await Promise.all([
    runClassifier(CRISIS_PROMPT, answer),
    runClassifier(SAFEGUARDING_PROMPT, answer),
    runClassifier(HOSTILITY_PROMPT, answer)
  ]);
  return { crisis, safeguarding, hostility };
}

/* REFLECTION */
function reflectionSystemPrompt(arc) {
  const arcDescription = arc === 'wellness'
    ? 'You are reflecting on wellbeing, life, values, and what matters to the resident (Sections 1 to 3).'
    : 'You are reflecting on the resident\'s home, building, and surroundings (Section 4).';
  return `You are a Motivational Interviewing reflection layer for OBOS Home+, a welfare conversation tool used by older residents in Norway. ${arcDescription}

Write ONE short reflection (1 to 2 sentences) that names what was heard, in MI register. Warm, unhurried, never analytical.

HARDLINE RULES, do not break any:
- Do not advise, warn, or diagnose.
- Do not recommend services.
- Do not include any phone number, URL, address, or organisation name.
- Do not mention any US resource.
- Do not mention OBOS, Housing Officer, Wellness Report, or Home Report by name.
- Do not volunteer the resident for any activity.
- Do not classify the resident as an asset or community resource.
- Do not name a forecast or any weather information.
- Do not surface or paraphrase content from a different section than the one being reflected on. Iron Curtain enforcement.

STYLE:
- 1 to 2 sentences only.
- Warm, plain, no clinical language.
- Reflect what was said; do not interpret beneath it.
- Do not begin with "It sounds like" or "I hear that"; write naturally.
- Do not end on a question.
- Do not suggest what the resident should do next.
- ${NO_EM_DASH_RULE}

Output ONLY the reflection text. No preamble, no quotes, no labels.`;
}
async function generateReflection(arc, questionText, answer, priorContext = []) {
  let userMessage = '';
  if (priorContext.length > 0) {
    userMessage += 'Earlier in this conversation:\n';
    priorContext.slice(-2).forEach(p => { userMessage += `Q: ${p.q}\nA: ${p.a}\n\n`; });
  }
  userMessage += `Now this exchange:\nQ: ${questionText}\nA: ${answer}\n\nWrite a 1 to 2 sentence MI reflection.`;
  return await callClaude(reflectionSystemPrompt(arc), userMessage, 200);
}

function findQuestionByKey(key) {
  for (const sec of Object.values(QUESTIONS)) {
    const q = sec.questions.find(q => q.key === key);
    if (q) return q;
  }
  return null;
}

async function processAnswer(answer) {
  const q = getCurrentQuestion();
  const arc = currentSection === 's4' ? 'home' : 'wellness';
  const arcData = arc === 'wellness' ? session.wellnessArc : session.homeArc;
  renderProcessing();
  try {
    const flags = await runAllClassifiers(answer);
    if (flags.crisis) {
      session.safetyFlags.crisis = true; session.safetyFlags.anyFiredThisSession = true;
      renderCrisisScreen(); return;
    }
    if (flags.safeguarding) {
      session.safetyFlags.safeguarding = true; session.safetyFlags.anyFiredThisSession = true;
      renderSafeguardingScreen(); return;
    }
    if (flags.hostility) {
      session.safetyFlags.hostility = true; session.safetyFlags.anyFiredThisSession = true;
      renderSovereigntyPause(); return;
    }
    const priorContext = Object.entries(arcData.answers).map(([key, v]) => ({
      q: findQuestionByKey(key)?.text || key, a: v.text
    }));
    const reflection = await generateReflection(arc, q.text, answer, priorContext);
    arcData.answers[q.key] = { text: answer, reflection };
    renderReflection(reflection);
  } catch (e) {
    console.error('processAnswer error:', e);
    setScreen(`
      <h2>A small hiccup.</h2>
      <p>Something went wrong reaching the conversation engine.</p>
      <div class="quote">${escapeHtml(e.message)}</div>
      <div class="button-row">
        <button class="primary" onclick="renderQuestion()">Try again</button>
        <button onclick="advanceQuestion()">Skip and continue</button>
      </div>
    `);
  }
}

function advanceQuestion() {

/* WELLNESS REPORT */
async function generateWellnessReport() {
  setArc('wellness');
  renderProcessing();
  try {
    const wellnessAnswers = Object.entries(session.wellnessArc.answers).map(([key, v]) => {
      const q = findQuestionByKey(key);
      return `[${key}] Q: ${q?.text}\nA: ${v.text}`;
    }).join('\n\n');
    const systemPrompt = `You are generating a personalised "Your Wellness Report" for a resident who has just completed Sections 1 to 3 of OBOS Home+.

Use exactly these four section headings, in this order. Each heading is followed by a colon on its own line, then the content:

## Your Words:
Open with a short, resonant fragment from the resident's answer to s1q1, drawn verbatim or near-verbatim.

## What Matters Most:
Drawn from s3q1. This is the headline.

## Your Opportunities:
Surface ONLY the domains the resident actually raised. Use their framing. Do not invent concerns they did not raise.

## Your Choice:
A single one-line affirmation of the resident's agency over what happens next.

HARDLINE RULES:
- Observational language only ("you mentioned", "you described").
- No clinical or diagnostic language.
- No instrument names (WHO-5, ASCOT, SCD-Initiative, UCLA, FINGER, ICECAP-O).
- No services recommended.
- No phone numbers or URLs.
- Do not refer to anything from Section 4; you do not have access to Section 4.
- Address the resident in second person ("you"). Use the name only sparingly.
- Use markdown ## headings for each section, each heading ending with a colon.
- ${NO_EM_DASH_RULE}`;
    const userMessage = `Resident's name, if given: ${session.name || 'not given'}\n\nThe conversation, Sections 1 to 3 only, Iron Curtain enforced:\n\n${wellnessAnswers}\n\nGenerate the Your Wellness Report now.`;
    const report = await callClaude(systemPrompt, userMessage, 1500);
    session.wellnessReport = report;
    await detectAsset();
    computeEngagement();
    renderWellnessReport();
  } catch (e) {
    setScreen(`<h2>Hiccup.</h2><div class="quote">${escapeHtml(e.message)}</div><button class="primary" onclick="generateWellnessReport()">Try again</button>`);
  }

async function detectAsset() {
  const candidates = ['s1q3', 's1q5', 's3q2']
    .map(k => session.wellnessArc.answers[k])
    .filter(Boolean).map(v => v.text).join('\n---\n');
  if (!candidates) return;
  const systemPrompt = `Evaluate whether a resident has surfaced a Community Talent, a long-held skill, craft, career, or capability they could share with their building's community. Conservative threshold.

Return ONLY a JSON object: {"captured": true|false, "talent": "..." | null}

Capture ONLY when:
(a) The resident dwelled on the topic, OR
(b) Used language of capability or willingness ("I could still", "I'd happily", "I miss having a use for")

Do NOT capture passing mentions or topics described with weariness. The "talent" string, if captured, is a short phrase in the resident's voice. ${NO_EM_DASH_RULE}`;
  try {
    const resp = await callClaude(systemPrompt, candidates, 200);
    const jsonMatch = resp.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      const obj = JSON.parse(jsonMatch[0]);
      if (obj.captured) {
        session.wellnessArc.assetCaptured = true;
        session.wellnessArc.assetTalent = obj.talent;
      }
    }
  } catch (e) { console.warn('Asset detection error:', e); }
}
function computeEngagement() {
  const answered = Object.keys(session.wellnessArc.answers).length;
  const skips = session.wellnessArc.skipCount;
  if (answered < 3) session.engagementLevel = 0;
  else if (skips >= 2) session.engagementLevel = 1;
  else session.engagementLevel = 2;
}

/* CANDIDATE-LINK DETECTION */
async function runCandidateLinkDetection() {
  renderProcessing();
  if (session.safetyFlags.anyFiredThisSession) { await generateHomeReport(); return; }
  const wellnessContext = Object.entries(session.wellnessArc.answers).map(([k, v]) => {
    const q = findQuestionByKey(k); return `${q?.text}\n=> ${v.text}`;
  }).join('\n\n');
  const homeContext = Object.entries(session.homeArc.answers).map(([k, v]) => {
    const q = findQuestionByKey(k); return `${q?.text}\n=> ${v.text}`;
  }).join('\n\n');
  if (!wellnessContext || !homeContext) { await generateHomeReport(); return; }

  const systemPrompt = `You are the Candidate-Link Detection layer for OBOS Home+. This is the ONLY moment in the architecture where you have access to BOTH wellbeing material (Sections 1 to 3) and home material (Section 4) in the same context.

Detect whether there is a plausible connection between (a) a concrete home or environs issue from Section 4 and (b) wellbeing material from Sections 1 to 3.

CONSERVATIVE THRESHOLD. False positives are worse than false negatives. A passing mention of "things have been a bit harder" with a Section 4 mention of a lift issue is NOT enough. The wellbeing material must have specificity (a concrete activity, change, or feeling) that plausibly connects to the home issue.

Return EXACTLY a JSON object, nothing else:
{
  "linkCandidate": true | false,
  "homeIssue": "..." | null,
  "paraphrasedWellbeingFragment": "..." | null
}

The paraphrasedWellbeingFragment is a short, NEUTRAL paraphrase, like "you've been finding things take more effort lately" or "you're not getting out as much as you used to". NEVER clinical. NEVER name a domain. ${NO_EM_DASH_RULE}`;
  const userMessage = `Sections 1 to 3 (wellbeing):\n\n${wellnessContext}\n\n---\n\nSection 4 (home):\n\n${homeContext}\n\nDetect:`;
  try {
    const resp = await callClaude(systemPrompt, userMessage, 400);
    const jsonMatch = resp.match(/\{[\s\S]*\}/);
    if (!jsonMatch) { await generateHomeReport(); return; }
    const obj = JSON.parse(jsonMatch[0]);
    if (obj.linkCandidate) {
      session.linkage.candidateDetected = true;
      session.linkage.homeIssueQuoted = obj.homeIssue;
      session.linkage.paraphrasedFragment = obj.paraphrasedWellbeingFragment;
      renderSupplementaryQuestion();
    } else { await generateHomeReport(); }
  } catch (e) {
    console.warn('Candidate-link detection error:', e);
    await generateHomeReport();
  }
}

function renderSupplementaryQuestion() {
  const homeIssue = session.linkage.homeIssueQuoted;
  const fragment = session.linkage.paraphrasedFragment;
  setScreen(`
    <h2>Something to think about.</h2>
    <p>Earlier, you mentioned <em>${escapeHtml(homeIssue)}</em>.</p>
    <p>You also mentioned that ${escapeHtml(fragment)}.</p>
    <p>Sometimes these things are connected, and sometimes they are not. Only you can really say.</p>
    <p style="font-size:19px;margin:28px 0;font-weight:600;">Would you say the ${escapeHtml(homeIssue)} is affecting how you feel or how you manage day to day?</p>
    <div class="button-row stack">
      <button onclick="answerSupp('yes')">Yes, they're connected</button>
      <button onclick="answerSupp('no')">No, they're separate</button>
      <button onclick="answerSupp('rather_not')">I'd rather not say</button>
    </div>
  `, 'home-arc-card');
}
async function answerSupp(answer) {
  if (answer === 'yes') {
    session.linkage.residentConfirmed = true;
    renderProcessing();
    await generateLinkageStatement();
    await generateHomeReport();
  } else {
    session.linkage.candidateDetected = false;
    session.linkage.homeIssueQuoted = null;
    session.linkage.paraphrasedFragment = null;
    session.linkage.residentConfirmed = false;
    await generateHomeReport();
  }
}

async function generateLinkageStatement() {
  const homeIssue = session.linkage.homeIssueQuoted;
  const addr = session.name || 'the resident';
  const systemPrompt = `Generate a single sentence in fixed grammar. Do not deviate.

GRAMMAR:
"[Resident's name or 'the resident'] has reported [home issue, in their words] and has indicated this is affecting their [wellbeing | day-to-day life | comfort at home]."

You MUST:
- Use exactly this grammar.
- Choose ONE of the three permitted closing phrases: "wellbeing", "day-to-day life", or "comfort at home".
- Quote the home issue in the resident's words from the input.
- Use the name "${addr}" exactly as given.
- Output ONLY the sentence, nothing else.

You MUST NOT:
- Specify a condition, symptom, mood, frequency, or severity.
- Use clinical, medical, or psychological terms.
- Add any context, explanation, or qualification.
- ${NO_EM_DASH_RULE}`;
  const userMessage = `Resident name: ${addr}\nHome issue (in resident's words): "${homeIssue}"\n\nGenerate the single linkage sentence.`;
  try {
    const stmt = await callClaude(systemPrompt, userMessage, 100);
    session.linkage.fixedStatement = stmt.trim().replace(/^["']|["']$/g, '');
  } catch (e) {
    console.warn('Linkage generation failed:', e);
    session.linkage.residentConfirmed = false;
    session.linkage.fixedStatement = null;
  }
}

      note,
      'Community Captain',
      'wellness-arc'
    );
  } catch (e) { setScreen(`<p>${escapeHtml(e.message)}</p><button onclick="renderConsentedClick()">Back</button>`); }
}

function sendPulse() {

function wipeSession() {
  // Best-effort secure wipe of session contents while keeping a small marker so the screen still works
  session.anthropicApiKey = null;
  session.wellnessArc = { answers: {}, skipCount: 0, assetCaptured: false, assetTalent: null, assetConsent: null };
  session.homeArc = { answers: {}, skipCount: 0 };
  session.linkage = { candidateDetected: false, paraphrasedFragment: null, homeIssueQuoted: null, residentConfirmed: false, fixedStatement: null };
  session.wellnessReport = null;
  session.homeReport = null;
  session.sharedReports = [];
  session.name = null;

}
function attemptClose() {
  // Browsers block window.close() on tabs the user opened. Try anyway, then show fallback.
  try { window.close(); } catch (e) {}
  // If still here after 250ms, replace the screen with a clear instruction
  setTimeout(() => {
    setScreen(`
      <h1>Session ended.</h1>
      <p class="lead">Your browser keeps tabs open until you close them yourself, so please close this tab now using your browser's tab controls.</p>
      <p class="soft">On most computers: click the X on the tab, or press Ctrl+W (Windows) or Cmd+W (Mac).</p>
      <p class="soft">On a phone or tablet: tap the tabs button, then close this one.</p>
    `);
  }, 250);
}

/* VOICE INPUT */
let recognition = null;
let voiceTimer = null;
let stillListeningTimer = null;
let isRecording = false;
function toggleVoice() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('Voice input requires Chrome or another Chromium-based browser. Please type your answer.');
    return;
  }
  if (isRecording) { stopVoice(); return; }
  startVoice();
}
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-GB';
  recognition.continuous = true;
  recognition.interimResults = true;
  isRecording = true;
  const btn = document.getElementById('voiceBtn');
  const status = document.getElementById('voiceStatus');
  if (btn) { btn.classList.add('recording'); btn.textContent = 'Stop'; }
  if (status) status.textContent = 'listening...';
  let finalText = '';
  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t + ' '; else interim += t;
    }
    const ta = document.getElementById('answer') || document.getElementById('sayMore');
    if (ta) ta.value = (finalText + interim).trim();
    resetSilenceTimers();
  };
  recognition.onerror = (e) => { console.warn('Speech error:', e); stopVoice(); };
  recognition.onend = () => { isRecording = false; };
  recognition.start();
  resetSilenceTimers();
}
function resetSilenceTimers() {
  clearTimeout(stillListeningTimer); clearTimeout(voiceTimer);
  stillListeningTimer = setTimeout(() => {
    const status = document.getElementById('voiceStatus');
    if (status) status.textContent = 'still listening...';
  }, STILL_LISTENING_MS);
  voiceTimer = setTimeout(() => stopVoice(), VOICE_SILENCE_MS);
}
function stopVoice() {
  clearTimeout(voiceTimer); clearTimeout(stillListeningTimer);
  try { recognition?.stop(); } catch(_){}
  isRecording = false;
  const btn = document.getElementById('voiceBtn');
  const status = document.getElementById('voiceStatus');
  if (btn) { btn.classList.remove('recording'); btn.textContent = 'Speak your answer'; }
  if (status) status.textContent = '';
}

/* Lightweight markdown renderer for reports; honours colon-terminated headings */
function renderMarkdownLite(md) {
  if (!md) return '';
  // First, normalise away em dashes if any have crept in
  md = md.replace(/\u2014/g, ', ').replace(/\u2013/g, ', ');
  let html = escapeHtml(md);
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, '<em>$1</em>');
  html = html.replace(/(?:^|\n)((?:- .+(?:\n- .+)*))/g, (m, list) => {
    const items = list.trim().split('\n').map(l => l.replace(/^- /, '').trim());
    return '\n<ul class="report-list">' + items.map(i => '<li>'+i+'</li>').join('') + '</ul>';
  });
  html = html.split(/\n\n+/).map(p => {
    if (p.trim().startsWith('<')) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  return html;
}
